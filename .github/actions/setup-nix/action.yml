name: Setup Nix with niks3
description: Setup Nix environment with the niks3 binary cache
runs:
  using: composite
  steps:
    - name: Install Nix
      # Installing Nix in single user mode causes `man-cache` build to fail on Linux,
      # so nixbuild/nix-quick-install-action cannot be used
      # https://github.com/nix-community/cache-nix-action/issues/60#issuecomment-3561402982
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        extra_nix_config: |
          extra-substituters = https://cache.nixos-cuda.org
          extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
    - name: Setup niks3
      uses: Mic92/niks3-action@347a156f2b7d8120fee9609272c0961ce555f7f9 # v1.8.0
      with:
        server-url: https://niks3.natsukium.com
